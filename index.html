 .screen:after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;

width:100%;text-align:center;white-space:nowrap;pointer-events:none;

color:rgba(221,235,246,.16);user-select:none}

display:flex;align-items:center;gap:18px;text-decoration:none;color:#f7fbff;
font:600 12px 'Space Grotesk';letter-spacing:.2em}

}

/* Unified editorial serif for every game heading and navigation label */
.editorial h1,.nav a{font-family:Georgia,'Times New Roman',serif!important;font-weight:400!important}

</style></head><body><main class="screen">
<header class="topbar"><a class="logo" href="index.html">S<span>✦</span></a>
<nav class="nav"><a href="works.html">ENDFIELD ↗</a><a href="zzz.html">ZZZ ↗</a><a href="鳴潮.html">鳴潮 ↗</a></nav></header>
<div class="edition">INDEPENDENT CREATIVE ARCHIVE — VOL. 001</div>
<div class="atmosphere" aria-hidden="true"></div><div class="hero-word" aria-hidden="true">STUDIO</div>
<div class="scene" id="scene" aria-label="宝石をスワイプして回転。各ゲームの面をタップすると移動できます"></div>
<div class="hover-name" id="hoverName"></div>
<section class="editorial"><div class="kicker" id="activeKicker">EXPLORE THE WORLD</div>
<h1 id="activeTitle">ENDFIELD</h1><div class="edition-index" id="activeNumber">01 / 04</div></section>
<div class="hint">← DRAG TO ROTATE THE CRYSTAL →</div>
<a class="enter" id="activeLink" href="works.html">EXPLORE <span class="circle">↗</span></a>
<div class="fallback" id="fallback">3Dを表示できませんでした。<br><a href="works.html">ENDFIELD</a> / <a href="zzz.html">ZZZ</a> / <a href="鳴潮.html">鳴潮</a></div>
</main><script type="module">
import * as THREE from 'three';
const host=document.getElementById('scene'), hoverName=document.getElementById('hoverName');
const activeTitle=document.getElementById('activeTitle'),activeNumber=document.getElementById('activeNumber'),activeLink=document.getElementById('activeLink'),activeKicker=document.getElementById('activeKicker');
let currentSector=-1;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(32,1,.1,100);
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.28;
host.appendChild(renderer.domElement);

// Large, soft studio reflectors reflected in the crystal, not an opaque blue fill.
const studio=new THREE.Scene();studio.background=new THREE.Color('#020408');
function reflector(x,y,z,w,h,color,intensity,ry=0){
 const mat=new THREE.MeshBasicMaterial({color:new THREE.Color(color).multiplyScalar(intensity),side:THREE.DoubleSide});
 const panel=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat);
 panel.position.set(x,y,z);panel.rotation.y=ry;studio.add(panel);
}
reflector(-5,6,5,2.2,4.2,'#ffffff',2.0,.38);




const pmrem=new THREE.PMREMGenerator(renderer);
try{scene.environment=pmrem.fromScene(studio,.045).texture}catch(e){console.warn("Environment reflection unavailable",e)}
scene.add(new THREE.AmbientLight(0xffffff,.10));
function light(color,power,x,y,z){const l=new THREE.DirectionalLight(color,power);l.position.set(x,y,z);scene.add(l)}
light(0xffffff,3.0,-4,7,6);

// True cut silhouette: left culet, pavilion, girdle, crown, right-hand flat table.
// Four sectors, each comprising exactly four of the 16 radial facets.
const N=16, TAU=Math.PI*2, radius=2.2;
const sectors=[
 {name:'ENDFIELD',url:'works.html',tint:0xd6f3ff},
 {name:'ZZZ',url:'zzz.html',tint:0xd8d2ff},
 {name:'鳴潮',url:'鳴潮.html',tint:0xc5fff1},
 {name:'ARCHIVE',url:null,tint:0xffe8c4}
];
const diamond=new THREE.Group(), tilt=new THREE.Group();
scene.add(tilt);tilt.add(diamond);
// Tilt is static. Only the diamond spins around its own local X axis.
tilt.rotation.set(.12,-.29,-.25);
const p=(x,r,a)=>new THREE.Vector3(x,r*Math.cos(a),r*Math.sin(a));
const rings=[[-2.65,0],[-.42,radius],[-.25,radius],[.64,1.28]];
// Each cut face gets its own physically shaded surface: no white translucent overlay.
// Restrained crystal optics: clear facets with a single off-axis key light.
// Opacity is intentionally low: the dark background remains visible through the stone.

 // Optical faceting: opaque refractive-looking surfaces with crisp, moving reflections.
 // No wireframe, foggy alpha layers, or unbounded additive glow.
 const pickTargets=[];
 // Multi-bounce spectral crystal shader. Facet normals are intentionally flat.
 const gemVertex=`
 varying vec3 vWorld; varying vec3 vNormal; varying vec3 vLocal;
 void main(){
   vLocal=position;
   vec4 world=modelMatrix*vec4(position,1.0);
   vWorld=world.xyz;
   vNormal=normalize(mat3(modelMatrix)*normal);
   gl_Position=projectionMatrix*viewMatrix*world;
 }`;
 const gemFragment=`
 precision highp float;
 varying vec3 vWorld; varying vec3 vNormal; varying vec3 vLocal;
 uniform vec3 uCamera; uniform vec3 uLight; uniform float uSector;
 const float IOR=2.417;
 float sat(float v){return clamp(v,0.0,1.0);}
 // A single studio emitter: directional softbox and its sharp specular core.
 // Everything below derives from the same fixed light direction.
 vec3 studio(vec3 d){
   d=normalize(d);
   vec3 key=normalize(vec3(-0.49,0.72,0.49));
   float axis=dot(d,key);
   float soft=pow(sat(axis),9.0);
   float strip=pow(sat(axis),46.0);
   float pin=pow(sat(axis),240.0);
   float horizon=pow(sat(1.0-abs(d.y)),3.0);
   vec3 base=mix(vec3(0.005,0.013,0.024),vec3(0.030,0.063,0.096),sat(d.y*0.5+0.5));
   base+=vec3(0.16,0.24,0.32)*horizon*0.22;
   return base+vec3(0.48,0.68,0.86)*soft+vec3(1.4,1.65,1.8)*strip+vec3(4.0,3.8,3.4)*pin;
 }
 void main(){
   vec3 N=normalize(vNormal);
   vec3 V=normalize(uCamera-vWorld);
   if(dot(N,V)<0.0) N=-N;
   float ndv=sat(dot(N,V));
   float f0=pow((IOR-1.0)/(IOR+1.0),2.0);
   float fres=f0+(1.0-f0)*pow(1.0-ndv,5.0);
   vec3 incoming=-V;
   vec3 reflection=reflect(incoming,N);
   // Entry refraction, a pavilion bounce, then exit refraction.
   // The spectral IOR offsets reproduce subtle diamond fire without a rainbow overlay.
   vec3 spectral=vec3(0.0);
   for(int k=0;k<3;k++){
     float ior=2.397+float(k)*0.022;
     vec3 entry=refract(incoming,N,1.0/ior);
     vec3 pavilion=normalize(vec3(-0.76,-0.29,0.58)+vec3(0.0,0.20*sin(vLocal.z*1.4),0.17*cos(vLocal.y*1.3)));
     vec3 bounce=reflect(entry,pavilion);
     vec3 exitRay=refract(bounce,-N,ior);
     if(length(exitRay)<0.01) exitRay=reflect(bounce,-N);
     vec3 sampleCol=studio(exitRay)*0.62+studio(bounce)*0.29+studio(entry)*0.16;
     if(k==0) spectral.r=sampleCol.r;
     if(k==1) spectral.g=sampleCol.g;
     if(k==2) spectral.b=sampleCol.b;
   }
   vec3 reflected=studio(reflection);
   vec3 col=mix(spectral,reflected,fres);
   // Contrasting dark pavilion cuts and clear, intensely bright crown facets.
   float cut=sat(dot(N,normalize(vec3(-0.53,0.72,0.45))));
   float interior=0.66+0.34*cut;
   col*=interior;
   float rim=pow(1.0-ndv,3.0);
   col+=vec3(0.19,0.38,0.52)*rim*0.68;
   // Tight specular caustic from the one light, not random glitter.
   vec3 L=normalize(uLight-vWorld);
   vec3 H=normalize(L+V);
   float sparkle=pow(sat(dot(N,H)),380.0);
   col+=vec3(2.4,2.65,2.8)*sparkle;
   col=vec3(1.0)-exp(-col*1.23);
   gl_FragColor=vec4(pow(col,vec3(0.90)),1.0);
 }`;
 const faces=[];
 function facet(a,b,c,group){
   const g=new THREE.BufferGeometry();
   g.setAttribute('position',new THREE.Float32BufferAttribute([...a.toArray(),...b.toArray(),...c.toArray()],3));
   g.computeVertexNormals();
   const material=new THREE.ShaderMaterial({vertexShader:gemVertex,fragmentShader:gemFragment,
     uniforms:{uCamera:{value:camera.position},uLight:{value:new THREE.Vector3(-5,8,7)},uSector:{value:group%2}},
     side:THREE.DoubleSide,depthWrite:true});
   const mesh=new THREE.Mesh(g,material);
   diamond.add(mesh);faces.push(mesh);
 }
 // 16 radial divisions; precision-cut crown, girdle and pavilion.
 // A real flat table closes the front; facets do not converge into a wireframe point.
 for(let i=0;i<N;i++){
   const a=i*TAU/N,b=(i+1)*TAU/N,group=Math.floor(i/4);
   const tip=p(-2.12,0,a),loA=p(-.48,1.80,a),loB=p(-.48,1.80,b);
   const hiA=p(-.36,1.80,a),hiB=p(-.36,1.80,b);
   const crA=p(.40,1.06,a),crB=p(.40,1.06,b);
   const center=new THREE.Vector3(.40,0,0);
   facet(tip,loB,loA,group);
   facet(loA,loB,hiB,group);facet(loA,hiB,hiA,group);
   facet(hiA,hiB,crB,group);facet(hiA,crB,crA,group);
   facet(crA,crB,center,group);
 }
 // Invisible, geometrically aligned hit zones keep the original four game destinations.
 function addTriangle(arr,a,b,c){arr.push(...a.toArray(),...b.toArray(),...c.toArray())}
 for(let sector=0;sector<4;sector++){
  const triangles=[];
  for(let i=sector*4;i<(sector+1)*4;i++){
   const a=i*TAU/N,b=(i+1)*TAU/N;
   addTriangle(triangles,p(-2.12,0,a),p(-.48,1.80,a),p(-.48,1.80,b));
   addTriangle(triangles,p(-.36,1.80,a),p(.40,1.06,a),p(.40,1.06,b));
   addTriangle(triangles,p(-.36,1.80,a),p(.40,1.06,b),p(-.36,1.80,b));
  }
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(triangles,3));geo.computeVertexNormals();
  const hit=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({visible:false,side:THREE.DoubleSide}));
  diamond.add(hit);pickTargets.push({object:hit,...sectors[sector]});
 }
const pointer=new THREE.Vector2(),ray=new THREE.Raycaster();
let dragging=false,travel=0,lastX=0,startX=0,startY=0,velocity=0,spin=.13;
function pick(e){
 const r=host.getBoundingClientRect();
 pointer.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height*2-1));
 ray.setFromCamera(pointer,camera);
 const hits=ray.intersectObjects(pickTargets.map(x=>x.object),false);
 return hits.length?pickTargets.find(x=>x.object===hits[0].object):null;
}
host.addEventListener('pointerdown',e=>{
 dragging=true;travel=0;startX=lastX=e.clientX;startY=e.clientY;velocity=0;
 host.setPointerCapture(e.pointerId);
});
host.addEventListener('pointermove',e=>{
 if(dragging){
  const dx=e.clientX-lastX;
  travel=Math.max(travel,Math.hypot(e.clientX-startX,e.clientY-startY));
  diamond.rotation.x+=dx*.010;velocity=dx*.005;lastX=e.clientX;
 }else{
  const target=pick(e);
  hoverName.textContent=target?.url?target.name+' ↗':'';
  hoverName.classList.toggle('show',!!target?.url);
  host.style.cursor=target?.url?'pointer':'grab';
 }
});
host.addEventListener('pointerup',e=>{
 if(travel<9){const target=pick(e);if(target?.url)window.location.href=target.url}
 dragging=false;
});
host.addEventListener('pointercancel',()=>dragging=false);
function resize(){
 const w=host.clientWidth,h=host.clientHeight;
 camera.aspect=w/h;camera.position.set(0,0,w<700?12.8:11.2);
 camera.fov=w<700?39:32;camera.updateProjectionMatrix();
 renderer.setSize(w,h,false);
 // Larger than previous iteration; keep title and caption clear.
 tilt.position.set(w<700?0:-.25,w<700?-.05:0,0);
 tilt.scale.setScalar(w<700?0.99:1.22);
}
window.addEventListener('resize',resize);resize();
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let prev=performance.now();
function animate(now){
 const dt=Math.min((now-prev)/1000,.05);prev=now;
 if(!dragging&&!reduced){
  diamond.rotation.x+=(spin+velocity)*dt;
  velocity*=Math.pow(.90,dt*60);
 }
 
 const angle=((diamond.rotation.x%(Math.PI*2))+(Math.PI*2))%(Math.PI*2);
  const sector=Math.floor(((angle+Math.PI/4)%(Math.PI*2))/(Math.PI/2));
  if(sector!==currentSector){
    currentSector=sector;
    const names=['ENDFIELD','ZENLESS ZONE ZERO','WUTHERING WAVES','THE ARCHIVE'];
    const urls=['works.html','zzz.html','鳴潮.html',null];
    activeTitle.textContent=names[sector];
    activeTitle.classList.toggle('long',names[sector].length>13);
    activeNumber.textContent='0'+(sector+1)+' / 04';
    activeKicker.textContent=sector===3?'CURATED COLLECTION':'EXPLORE THE WORLD';
    activeLink.href=urls[sector]||'#';
    activeLink.style.visibility=urls[sector]?'visible':'hidden';
    document.documentElement.style.setProperty('--accent',['#b5e9ff','#e3cfff','#b5f9e5','#e8d5b8'][sector]);
  }
  renderer.render(scene,camera);requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script><script>window.addEventListener('error',e=>{if(e.message&&e.message.includes('module'))document.getElementById('fallback').style.display='flex'});</script></body></html>
