import * as THREE from 'three';
// Procedural black silk. Actual flowing folds with curved ridges, not diagonal SVG bands.
const silkFabric=document.getElementById('silkFabric');
function drawSilkFabric(){
  const w=innerWidth,h=innerHeight;
  const scale=Math.min(1.0,900/Math.max(w,h));
  const cw=Math.max(1,Math.round(w*scale)),ch=Math.max(1,Math.round(h*scale));
  silkFabric.width=cw;silkFabric.height=ch;
  const ctx=silkFabric.getContext('2d',{alpha:false});
  const im=ctx.createImageData(cw,ch),d=im.data;
  const smooth=(a,b,x)=>{let t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)};
  for(let y=0;y<ch;y++)for(let x=0;x<cw;x++){
    const u=x/cw,v=y/ch;
    // Three broad folded cloth ridges with varying curvature and width.
    const f1=v-(.235+.17*Math.sin(u*3.65-1.10)+.07*u*u);
    const f2=v-(.67-.11*Math.sin(u*4.25+.5)+.095*u);
    const f3=v-(.92+.075*Math.sin(u*5.3-1.7));
    const fold=(t,width)=>Math.exp(-Math.pow(t/width,2));
    const ridge1=fold(f1,.029)*(1.0+.25*Math.sin(u*8.0));
    const ridge2=fold(f2,.043)*(1.0+.22*Math.cos(u*6.0));
    const ridge3=fold(f3,.035);
    const valley=fold(f1-.080,.072)*.72+fold(f2+.090,.095)*.62;
    const sheen=fold(f1+.038,.062)*.18+fold(f2-.043,.067)*.21;
    const fine=Math.sin((u*1100+v*170)*.58)*.012+Math.sin((u*720-v*300)*.9)*.009;
    const vignette=.72+.28*(1-Math.min(1,Math.hypot((u-.51)*.95,(v-.54)*.85)));
    let lum=(.012+ridge1*.35+ridge2*.31+ridge3*.20+sheen-valley*.12+fine*(ridge1+ridge2+.25))*vignette;
    lum=Math.max(.004,Math.min(.57,lum));
    const i=(y*cw+x)*4;
    d[i]=Math.round(3+lum*190);d[i+1]=Math.round(4+lum*199);d[i+2]=Math.round(8+lum*213);d[i+3]=255;
  }
  ctx.putImageData(im,0,0);
}
drawSilkFabric();
window.addEventListener('resize',drawSilkFabric);

const host=document.getElementById('scene'), hoverName=document.getElementById('hoverName');
// The original photograph stays untouched. This canvas adds a localized indentation,
// directional satin folds, contact occlusion and subtle silver bounce light.
const contactCanvas=document.getElementById('silkContact');
const contactCtx=contactCanvas.getContext('2d',{alpha:true});
function drawSilkContact(w,h){
 if(!contactCtx)return;
 const dpr=Math.min(window.devicePixelRatio||1,1.6);
 contactCanvas.width=Math.round(w*dpr);contactCanvas.height=Math.round(h*dpr);
 contactCtx.setTransform(dpr,0,0,dpr,0,0);
 contactCtx.clearRect(0,0,w,h);
 // This footprint is anchored to the same presentation region as the diamond.
 // Its broad, low-contrast deformation reads as fabric rather than a metallic ring.
 const mobile=w<700;
 const cx=w*(mobile?.57:.54),cy=h*(mobile?.58:.57);
 const rx=Math.min(w*.49,h*.37),ry=Math.min(h*.23,w*.43);
 contactCtx.save();contactCtx.translate(cx,cy);contactCtx.rotate(-.26);
 let g=contactCtx.createRadialGradient(0,0,rx*.08,0,0,rx*1.25);
 g.addColorStop(0,'rgba(0,0,0,.53)');g.addColorStop(.28,'rgba(0,0,0,.40)');
 g.addColorStop(.56,'rgba(0,0,0,.22)');g.addColorStop(.82,'rgba(0,0,0,.07)');g.addColorStop(1,'rgba(0,0,0,0)');
 contactCtx.save();contactCtx.scale(1,ry/rx);contactCtx.fillStyle=g;
 contactCtx.beginPath();contactCtx.arc(0,0,rx*1.25,0,Math.PI*2);contactCtx.fill();contactCtx.restore();
 // Compression creases: unequal curves and soft layered strokes, no concentric outlines.
 const folds=[[-1.10,-.33,-.67,-.69,-.21,-.73,.25],[-1.17,.17,-.74,.50,-.32,.68,.23],
 [.22,-.84,.66,-.73,1.05,-.38,.20],[.37,.70,.84,.58,1.14,.24,.19],
 [-.88,-.64,-.56,-.92,-.15,-1.03,.14],[.02,.88,.42,1.00,.86,.83,.16]];
 for(const [x1,y1,x2,y2,x3,y3,alpha] of folds){
  const pts=[x1*rx,y1*ry,x2*rx,y2*ry,x3*rx,y3*ry];
  contactCtx.beginPath();contactCtx.moveTo(pts[0],pts[1]);
  contactCtx.quadraticCurveTo(pts[2],pts[3],pts[4],pts[5]);
  contactCtx.strokeStyle=`rgba(0,0,0,${alpha+.08})`;contactCtx.lineWidth=mobile?19:25;
  contactCtx.shadowBlur=mobile?19:30;contactCtx.shadowColor='rgba(0,0,0,.6)';contactCtx.stroke();
  contactCtx.shadowBlur=0;contactCtx.translate(0,-3);
  contactCtx.strokeStyle=`rgba(172,191,214,${alpha*.26})`;contactCtx.lineWidth=mobile?3:5;contactCtx.stroke();
  contactCtx.translate(0,3);
 }
 // Cool bounce light on silk fibers, concentrated along the near rim.
 const shine=contactCtx.createRadialGradient(-rx*.24,ry*.34,0,-rx*.24,ry*.34,rx*.95);
 shine.addColorStop(0,'rgba(163,201,232,.12)');shine.addColorStop(.5,'rgba(90,126,160,.045)');shine.addColorStop(1,'rgba(90,126,160,0)');
 contactCtx.save();contactCtx.scale(1,.58);contactCtx.fillStyle=shine;
 contactCtx.fillRect(-rx*1.5,-ry*2.5,rx*3,ry*5);contactCtx.restore();
 contactCtx.restore();
}

// Physically anchored contact: project the *actual* stone geometry onto the silk.
// A foreground fabric lip overlaps the lower silhouette, removing the floating cut-out effect.
const overlapCanvas=document.getElementById('silkOverlap');
const overlapCtx=overlapCanvas.getContext('2d',{alpha:true});
function drawEmbeddedContact(w,h){
 if(!overlapCtx)return;
 const dpr=Math.min(devicePixelRatio||1,1.6);
 if(overlapCanvas.width!==Math.round(w*dpr)||overlapCanvas.height!==Math.round(h*dpr)){
  overlapCanvas.width=Math.round(w*dpr);overlapCanvas.height=Math.round(h*dpr);
 }
 overlapCtx.setTransform(dpr,0,0,dpr,0,0);overlapCtx.clearRect(0,0,w,h);
 tilt.updateMatrixWorld(true);camera.updateMatrixWorld(true);
 const projected=[];
 // The pavilion and girdle vertices define the actual on-screen lower boundary.
 for(const face of faces){
  const pos=face.geometry.attributes.position;
  for(let i=0;i<pos.count;i++){
   const v=new THREE.Vector3().fromBufferAttribute(pos,i).applyMatrix4(face.matrixWorld).project(camera);
   if(v.z>-1&&v.z<1)projected.push({x:(v.x*.5+.5)*w,y:(.5-v.y*.5)*h});
  }
 }
 if(!projected.length)return;
 const minX=Math.min(...projected.map(p=>p.x)),maxX=Math.max(...projected.map(p=>p.x));
 const maxY=Math.max(...projected.map(p=>p.y));
 const width=maxX-minX;
 // Contact is concentrated on the lower 10% of the diamond, not across its center.
 const centerX=(minX+maxX)*.5,baseY=maxY-9;
 const span=Math.min(width*.78,w*1.35),height=Math.max(16,Math.min(42,span*.07));
 const ctx=overlapCtx;ctx.save();ctx.translate(centerX,baseY);ctx.rotate(-.095);
 // A deep occlusion pocket immediately below the stone.
 ctx.save();ctx.scale(1,.22);
 let shadow=ctx.createRadialGradient(0,0,span*.07,0,0,span*.66);
 shadow.addColorStop(0,'rgba(0,0,0,.94)');shadow.addColorStop(.38,'rgba(0,0,0,.78)');
 shadow.addColorStop(.72,'rgba(0,0,0,.38)');shadow.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=shadow;ctx.beginPath();ctx.arc(0,0,span*.66,0,Math.PI*2);ctx.fill();ctx.restore();
 // Raised satin edge, irregular and softly folded, sits in front of the gem.
 const left=-span*.57,right=span*.55;
 const fabric=ctx.createLinearGradient(0,-height*1.25,0,height*1.8);
 fabric.addColorStop(0,'rgba(4,6,11,0)');fabric.addColorStop(.24,'rgba(5,8,14,.48)');
 fabric.addColorStop(.47,'rgba(6,9,15,.88)');fabric.addColorStop(.73,'rgba(4,6,11,.82)');fabric.addColorStop(1,'rgba(3,4,8,0)');
 ctx.fillStyle=fabric;ctx.beginPath();ctx.moveTo(left,height*.85);
 ctx.bezierCurveTo(left+span*.16,-height*.65,-span*.24,-height*.88,-span*.12,-height*.42);
 ctx.bezierCurveTo(span*.05,-height*1.08,span*.21,-height*.16,span*.34,-height*.60);
 ctx.bezierCurveTo(span*.45,-height*.40,right,height*.38,right,height*1.4);
 ctx.lineTo(left,height*1.65);ctx.closePath();ctx.fill();
 // Single-source satin highlight grazing the compressed ridge, deliberately restrained.
 ctx.beginPath();ctx.moveTo(left+span*.10,height*.01);
 ctx.bezierCurveTo(-span*.28,-height*.76,-span*.20,-height*.57,-span*.09,-height*.40);
 ctx.bezierCurveTo(span*.07,-height*.75,span*.17,-height*.19,span*.31,-height*.39);
 ctx.strokeStyle='rgba(155,179,203,.16)';ctx.lineWidth=2.1;ctx.shadowColor='rgba(140,181,220,.17)';ctx.shadowBlur=9;ctx.stroke();
 ctx.restore();
}

const activeTitle=document.getElementById('activeTitle'),activeNumber=document.getElementById('activeNumber'),activeLink=document.getElementById('activeLink'),activeKicker=document.getElementById('activeKicker');
let currentSector=-1;
const scene=new THREE.Scene();

// True cut silhouette: left culet, pavilion, girdle, crown, right-hand single flat table.
// Four sectors, each comprising exactly four of the 16 radial facets.
const N=16, TAU=Math.PI*2, radius=2.2;
const sectors=[
 {name:'ENDFIELD',url:'works.html',tint:0xd6f3ff},
 {name:'ZZZ',url:'zzz.html',tint:0xd8d2ff},
 {name:'鳴潮',url:'鳴潮.html',tint:0xc5fff1},

];
const diamond=new THREE.Group(), tilt=new THREE.Group();
scene.add(tilt);tilt.add(diamond);

tilt.rotation.set(.12,-.55,-.20);
const p=(x,r,a)=>new THREE.Vector3(x,r*Math.cos(a),r*Math.sin(a));
const rings=[[-2.65,0],[-.42,radius],[-.25,radius],[.64,1.28]];
// Each cut face gets its own physically shaded surface: no white translucent overlay.
// Restrained crystal optics: clear facets with a single off-axis key light.
// Opacity is intentionally low: the dark background remains visible through the stone.

 // Optical faceting: opaque refractive-looking surfaces with crisp, moving reflections.
 // No wireframe, foggy alpha layers, or unbounded additive glow.
 const pickTargets=[];
 // Multi-bounce spectral crystal shader. Facet normals are intentionally flat.
 const gemVertex=`
 varying vec3 vWorld; varying vec3 vNormal; varying vec3 vLocal;
 void main(){
   vLocal=position;
   vec4 world=modelMatrix*vec4(position,1.0);
   vWorld=world.xyz;
   vNormal=normalize(mat3(modelMatrix)*normal);
   gl_Position=projectionMatrix*viewMatrix*world;
 }`;
  const gemFragment=`
 precision highp float;
 varying vec3 vWorld; varying vec3 vNormal; varying vec3 vLocal;
 uniform vec3 uCamera; uniform vec3 uLight; uniform float uSector;
 float sat(float x){return clamp(x,0.0,1.0);}
 // One stationary studio emitter, sampled through a narrow softbox and a bright core.
