<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070b"><title>STUDIO — The Faceted Archive</title>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--accent:#b5e9ff;--muted:#8b97a6}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#05070b;color:#f4f5f7;font-family:'Manrope',sans-serif}
.screen{position:relative;height:100vh;height:100dvh;overflow:hidden;isolation:isolate;
background:radial-gradient(ellipse at 52% 54%,#18202a 0%,#0b1018 36%,#05070b 76%)}
.screen:before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
background:radial-gradient(ellipse at 52% 58%,rgba(186,220,255,.085),transparent 49%),
linear-gradient(110deg,transparent 20%,rgba(255,255,255,.025) 50%,transparent 80%)}
 .screen:after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
background:radial-gradient(ellipse 48% 36% at 74% 35%,rgba(100,153,190,.14),transparent 85%),
radial-gradient(ellipse 44% 32% at 20% 77%,rgba(123,99,150,.12),transparent 85%),
repeating-linear-gradient(122deg,transparent 0px,transparent 115px,rgba(183,216,245,.027) 116px,transparent 117px);
mask-image:linear-gradient(to bottom,transparent 4%,black 35%,black 85%,transparent)}
.atmosphere{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.atmosphere:before{content:"";position:absolute;width:68vmax;height:68vmax;left:50%;top:45%;transform:translate(-50%,-50%);border:1px solid rgba(186,216,241,.09);border-radius:50%;box-shadow:0 0 0 90px rgba(200,230,255,.009),0 0 0 210px rgba(200,230,255,.008)}
.atmosphere:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 15%,rgba(206,228,255,.045) 48%,transparent 68%);opacity:.65}
.topbar{position:absolute;top:clamp(26px,5vh,65px);left:clamp(23px,5vw,84px);right:clamp(23px,5vw,84px);z-index:12;
display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{font:500 clamp(24px,3vw,38px)/1 'Space Grotesk';letter-spacing:-.08em;text-decoration:none;color:#f2f5f8}
.logo span{color:var(--accent)}
.nav{display:flex;gap:clamp(12px,2.5vw,40px)}
.nav a{text-decoration:none;color:#c6cbd3;font:500 clamp(10px,1vw,13px) 'Space Grotesk';letter-spacing:.12em;
border-bottom:1px solid #66717c;padding-bottom:9px;transition:color .3s}
.nav a:hover{color:white;border-color:var(--accent)}
.edition{position:absolute;top:clamp(100px,16vh,170px);left:clamp(25px,5vw,84px);z-index:6;
font:500 10px 'Space Grotesk';letter-spacing:.3em;color:#a3b0c0}
.hero-word{position:absolute;z-index:1;top:39%;left:50%;transform:translate(-50%,-50%);
width:100%;text-align:center;white-space:nowrap;pointer-events:none;
font:400 clamp(78px,16vw,245px)/.9 Georgia,'Times New Roman',serif;letter-spacing:-.085em;
color:rgba(221,235,246,.16);user-select:none}
.scene{position:absolute;inset:0;z-index:3;touch-action:none;cursor:grab}
.scene:active{cursor:grabbing}.scene canvas{width:100%;height:100%;display:block}
.editorial{position:absolute;z-index:7;bottom:clamp(90px,13vh,155px);left:clamp(25px,5vw,84px);
pointer-events:none;max-width:calc(100% - 50px)}
.kicker{font:500 10px 'Space Grotesk';letter-spacing:.32em;color:var(--accent);margin-bottom:12px}
.editorial h1{margin:0;font:400 clamp(47px,8.2vw,145px)/.94 Georgia,'Times New Roman',serif;
letter-spacing:-.055em;max-width:92vw;text-shadow:0 5px 35px #03060ac4;overflow-wrap:normal}
.edition-index{margin-top:18px;font:500 11px 'Space Grotesk';letter-spacing:.25em;color:#a6b5c5}
.enter{position:absolute;z-index:10;bottom:clamp(32px,5vh,60px);right:clamp(24px,5vw,84px);
display:flex;align-items:center;gap:18px;text-decoration:none;color:#f7fbff;
font:600 12px 'Space Grotesk';letter-spacing:.2em}
.enter .circle{width:60px;height:60px;border:1px solid var(--accent);border-radius:50%;
display:grid;place-items:center;font-size:24px;transition:background .3s,transform .3s}
.enter:hover .circle{background:#ffffff22;transform:rotate(-35deg)}
.hint{position:absolute;z-index:7;bottom:clamp(42px,6vh,65px);left:clamp(25px,5vw,84px);
font:500 10px 'Space Grotesk';letter-spacing:.23em;color:#9ba7b6;pointer-events:none}
.hover-name{position:absolute;z-index:8;left:50%;top:61%;transform:translateX(-50%);
font:600 12px 'Space Grotesk';letter-spacing:.16em;opacity:0;pointer-events:none;transition:opacity .2s}
.hover-name.show{opacity:1}
.fallback{display:none;position:absolute;z-index:20;inset:0;background:#070b11;align-items:center;
justify-content:center;text-align:center;padding:40px;line-height:2}
.fallback a{color:#b5e9ff}
@media(max-width:700px){
.topbar{top:30px}.logo{font-size:28px}.nav{gap:13px}.nav a{font-size:10px;letter-spacing:.02em}
.edition{top:13%;font-size:8px}.hero-word{top:38%;font-size:clamp(76px,21vw,150px);opacity:.85;letter-spacing:-.07em}
.editorial{bottom:18%;left:7%}.editorial h1{font-size:clamp(43px,10.2vw,72px);max-width:90vw}
.editorial h1.long{font-size:clamp(38px,8vw,65px)}
.hint{bottom:5%;left:7%;font-size:8px}.enter{bottom:4%;right:7%;font-size:10px;gap:9px}
.enter .circle{width:48px;height:48px}.hover-name{top:62%}
}

/* Unified editorial serif for every game heading and navigation label */
.editorial h1,.nav a{font-family:Georgia,'Times New Roman',serif!important;font-weight:400!important}
.nav a{font-size:clamp(12px,1.3vw,17px)!important;letter-spacing:.025em!important}
.editorial h1{font-size:clamp(46px,8vw,125px);overflow-wrap:normal}
.editorial h1.long{font-size:clamp(30px,5.7vw,90px);letter-spacing:-.065em}
@media(max-width:700px){.nav a{font-size:12px!important}.editorial h1{font-size:clamp(43px,10.2vw,72px)}.editorial h1.long{font-size:clamp(29px,7vw,47px)}}
.silk{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}.silk svg{width:100%;height:100%;display:block;opacity:.95;filter:contrast(1.26) saturate(.35)}.screen:before{z-index:1;opacity:.5}.screen:after{opacity:.28}.atmosphere{opacity:.30}.hero-word{z-index:2}@media(max-width:700px){.silk svg{opacity:.90}}

/* Real silk reference supplied by the site owner, embedded to keep single-file deployment. */
.silk{background:#030407;overflow:hidden}
.silk-photo{display:none}
.screen:before{opacity:.14!important}.screen:after{opacity:.10!important}.atmosphere{opacity:.12!important}
@media(max-width:700px){.silk-photo{background-position:51% center}}
/* Soft satin deformation and contact lighting, separate from the original silk photo. */
.silk-overlap{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
.silk-contact{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;mix-blend-mode:normal}

/* Deep black satin: sculpted folds, one softbox, no external image. */
.screen{background:#030408}
.screen:before{opacity:.25!important;background:radial-gradient(ellipse at 60% 43%,rgba(57,72,93,.20),transparent 68%)}
.screen:after{opacity:.14!important;background:radial-gradient(ellipse at 22% 70%,rgba(112,125,143,.13),transparent 60%)}
.atmosphere{opacity:.08!important}
.silk{display:block!important;background:#030408;z-index:0}
.silk svg{opacity:1!important;filter:none!important}
.silk-contact{display:block!important}
.silk-overlap{display:block!important}
.hero-word{color:rgba(214,231,248,.055)}
/* Satin micro-sheen: applied to the background alone, not the diamond. */
.silk canvas{display:block;width:100%;height:100%;opacity:1}.silk::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 11% at 44% 29%,rgba(178,188,207,.095),transparent 74%),radial-gradient(ellipse 75% 9% at 52% 82%,rgba(167,178,197,.075),transparent 78%);mix-blend-mode:screen}

/* Architectural geometric background — isolated from the crystal and interface. */
.silk,.silk-contact,.silk-overlap{display:none!important}
.screen{background:#05090f!important}
.screen:before,.screen:after,.atmosphere{display:none!important}
.geo-backdrop{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(ellipse at 53% 47%,#25343e 0%,#121d28 19%,#080f19 44%,#03060a 82%)}
.geo-grid{position:absolute;inset:-55%;transform:perspective(650px) rotateX(47deg) rotateZ(-33deg) scale(1.1);opacity:.65;background:repeating-linear-gradient(0deg,transparent 0 55px,rgba(154,192,207,.085) 56px,transparent 58px),repeating-linear-gradient(90deg,transparent 0 60px,rgba(154,192,207,.085) 61px,transparent 63px);mask-image:radial-gradient(ellipse at center,#000 8%,transparent 64%)}
.geo-beam{position:absolute;inset:-20%;background:linear-gradient(110deg,transparent 26%,rgba(139,187,210,.05) 39%,rgba(219,242,255,.20) 41%,rgba(89,145,175,.045) 44%,transparent 55%);transform:rotate(-22deg)}
.beam-b{transform:rotate(44deg) scaleX(.8);opacity:.48}
.geo-aperture{position:absolute;width:90vmin;height:90vmin;left:50%;top:46%;transform:translate(-50%,-50%) rotate(-17deg);border:1px solid rgba(155,214,231,.23);border-radius:2%;box-shadow:0 0 90px rgba(70,134,160,.12),inset 0 0 75px rgba(133,184,209,.08);clip-path:polygon(50% 0,100% 22%,100% 77%,50% 100%,0 77%,0 22%);opacity:.8}
.geo-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 18%,rgba(0,2,5,.12) 54%,rgba(0,0,0,.67) 100%)}
@media(max-width:700px){.geo-aperture{width:125vw;height:125vw;top:48%}.geo-grid{opacity:.50}.geo-beam{opacity:.62}}

/* Full coverage for every angle: the square image spans the viewport diagonal. */
.silk,.geo-backdrop,.atmosphere,.scene,.silk-contact,.silk-overlap,.hero-word{display:none!important}
.screen{background:#050910!important;isolation:isolate;overflow:hidden}
/* Architectural background: continuous ambient image behind the rotating photograph */
.architecture{position:absolute;inset:0;z-index:2;overflow:hidden;touch-action:none;cursor:grab;background:#03070d}
.architecture:active{cursor:grabbing}
.architecture-underlay{position:absolute;inset:-12%;background-position:center;background-size:cover;background-repeat:no-repeat;filter:blur(25px) brightness(.40) saturate(.9);transform:scale(1.1);pointer-events:none}
.architecture img{position:absolute;left:50%;top:50%;width:145vw;height:145vw;max-width:none;object-fit:fill;transform:translate(-50%,-50%) rotate(0deg);transform-origin:center;filter:none;mask-image:radial-gradient(circle at center,#000 0%,#000 61%,rgba(0,0,0,.97) 70%,rgba(0,0,0,.77) 81%,rgba(0,0,0,.3) 94%,transparent 100%);-webkit-mask-image:radial-gradient(circle at center,#000 0%,#000 61%,rgba(0,0,0,.97) 70%,rgba(0,0,0,.77) 81%,rgba(0,0,0,.3) 94%,transparent 100%);user-select:none;-webkit-user-drag:none;pointer-events:none;will-change:transform}
.architecture-shade{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(180deg,rgba(2,5,11,.28),transparent 22%,transparent 75%,rgba(2,5,11,.34))}
.topbar,.edition{z-index:9}.editorial,.hint,.enter{z-index:10}

/* 2026-10-16: preserve the smaller architectural aperture / sky from the approved view.
   Do not enlarge the photo to conceal corners: feather only the perimeter. */
.architecture{background:#03070d}
.architecture img{
 width:100vw!important;height:100vw!important;
 object-fit:fill!important;
 mask-image:radial-gradient(circle at 50% 50%,#000 0%,#000 52%,rgba(0,0,0,.97) 62%,rgba(0,0,0,.76) 73%,rgba(0,0,0,.35) 86%,transparent 99%)!important;
 -webkit-mask-image:radial-gradient(circle at 50% 50%,#000 0%,#000 52%,rgba(0,0,0,.97) 62%,rgba(0,0,0,.76) 73%,rgba(0,0,0,.35) 86%,transparent 99%)!important;
}
/* A low-contrast, fixed ambient echo fills the outside during rotation without
   creating a visible rectangular image boundary or changing the foreground scale. */
.architecture-underlay{
 inset:0!important;
 background-size:cover!important;
 background-position:center!important;
 filter:blur(48px) brightness(.17) saturate(.7)!important;
 transform:scale(1.12)!important;
 opacity:.55;
}
.architecture-shade{background:linear-gradient(180deg,rgba(2,5,11,.10),transparent 24%,transparent 74%,rgba(2,5,11,.14))!important}

 const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
