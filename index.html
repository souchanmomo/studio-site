<body><main class="screen"><div class="noise"></div><nav class="links" aria-label="ゲームページ"><a href="works.html">ENDFIELD ↗</a><a href="zzz.html">ZZZ ↗</a><a href="鳴潮.html">鳴潮 ↗</a></nav><header class="brand"><div class="micro">CURATED DIGITAL GALLERY / 001</div><h1>STUDIO</h1><p>CREATIVE SOUND &amp; VISUAL PRODUCTION</p><div class="rule"></div></header><div class="scene" id="scene" aria-label="回転するダイヤモンド。ドラッグで回転し、ゲーム名の面をタップするとページを開きます"></div><div class="hover-name" id="hoverName"></div><div class="caption"><div class="overline">THE FACETED ARCHIVE</div><h2>Every facet, a world.</h2><p>光の断片に、異なる世界を映す。<br>宝石を回して、ゲームの面を選択。</p></div><div class="instructions">DRAG TO ROTATE / TAP TO ENTER<span>⟷</span></div><div class="fallback" id="fallback">3D表示を読み込めませんでした。<br><a href="works.html">ENDFIELD</a> / <a href="zzz.html">ZZZ</a> / <a href="鳴潮.html">鳴潮</a></div><div class="bottomline"></div></main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const host=document.getElementById('scene'),hoverName=document.getElementById('hoverName');
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(33,1,.1,100);camera.position.set(0,0,11.5);
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.65;host.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xe2f5ff,1.6));const light=(color,power,x,y,z)=>{const l=new THREE.DirectionalLight(color,power);l.position.set(x,y,z);scene.add(l)};light(0xffffff,3,-4,5,7);light(0x8acbff,3,5,-3,2);light(0xffe6b4,1.8,1,4,-5);
// Actual brilliant-cut proportions: flat table on right, crown, girdle, pavilion and left culet.
// The axis of symmetry runs from left to right along local X.
const N=16,R=2.05;const rings=[{x:-2.85,r:0,offset:0},{x:-.25,r:R,offset:0},{x:.02,r:R,offset:0},{x:.83,r:1.19,offset:0}];
const vertices=[],triangles=[];function v(x,r,a){return new THREE.Vector3(x,r*Math.cos(a),r*Math.sin(a))}
const apex=v(-2.85,0,0);for(let j=0;j<N;j++){const a=2*Math.PI*j/N,b=2*Math.PI*(j+1)/N;triangles.push([apex,v(-.25,R,a),v(-.25,R,b)]);for(let k=1;k<rings.length-1;k++){const A=rings[k],B=rings[k+1];const p=v(A.x,A.r,a),q=v(A.x,A.r,b),r=v(B.x,B.r,a),s=v(B.x,B.r,b);triangles.push([p,q,r],[q,s,r])}triangles.push([v(.83,1.19,a),v(.83,1.19,b),v(.83,0,0)])}
const positions=[];for(const tri of triangles)for(const p of tri)positions.push(p.x,p.y,p.z);const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));geo.computeVertexNormals();
const diamondMat=new THREE.MeshPhysicalMaterial({color:0xd7f4ff,metalness:0,roughness:.035,transmission:.90,thickness:1.9,ior:2.42,transparent:true,opacity:.88,side:THREE.DoubleSide,flatShading:true,clearcoat:1,clearcoatRoughness:.02,depthWrite:false});
const gem=new THREE.Group();scene.add(gem);const crystal=new THREE.Mesh(geo,diamondMat);gem.add(crystal);
const edges=new THREE.LineSegments(new THREE.EdgesGeometry(geo,18),new THREE.LineBasicMaterial({color:0xc5f4ff,transparent:true,opacity:.33,depthWrite:false}));gem.add(edges);
// Game links occupy separate crown facets, mounted to the same rotating geometry.
const faces=[{name:'ENDFIELD',url:'works.html',index:1},{name:'ZZZ',url:'zzz.html',index:6},{name:'鳴潮',url:'鳴潮.html',index:11}];const targets=[];
function labelTexture(text){const c=document.createElement('canvas');c.width=1024;c.height=256;const ctx=c.getContext('2d');ctx.clearRect(0,0,1024,256);ctx.font='600 92px Space Grotesk, Arial, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='#051527';ctx.shadowBlur=25;ctx.fillStyle='#ffffff';ctx.fillText(text,512,130);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
for(const f of faces){const a=2*Math.PI*(f.index+.5)/N;const x=.40,r=1.61;const pos=v(x,r,a);const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:labelTexture(f.name),transparent:true,depthTest:false,depthWrite:false,opacity:.95}));sprite.position.copy(pos);sprite.scale.set(f.name==='ENDFIELD'?1.23:.92,.30,1);sprite.renderOrder=5;gem.add(sprite);const hit=new THREE.Mesh(new THREE.SphereGeometry(.43,12,8),new THREE.MeshBasicMaterial({visible:false}));hit.position.copy(pos);gem.add(hit);targets.push({hit,sprite,...f})}
// Three-quarter view: table on right, pavilion pointing toward the left.
gem.rotation.set(.25,.45,-.17);let angle=0,drag=false,moved=false,startX=0,startY=0,lastX=0,lastY=0,vel=0;const pointer=new THREE.Vector2(),ray=new THREE.Raycaster();let hover=null;
function hitAt(e){const rect=host.getBoundingClientRect();pointer.x=((e.clientX-rect.left)/rect.width)*2-1;pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;ray.setFromCamera(pointer,camera);const hits=ray.intersectObjects(targets.map(t=>t.hit));return hits.length?targets.find(t=>t.hit===hits[0].object):null}
host.addEventListener('pointerdown',e=>{drag=true;moved=false;startX=lastX=e.clientX;startY=lastY=e.clientY;vel=0;host.setPointerCapture(e.pointerId)});host.addEventListener('pointermove',e=>{if(drag){const dx=e.clientX-lastX,dy=e.clientY-lastY;if(Math.hypot(e.clientX-startX,e.clientY-startY)>8)moved=true;gem.rotation.x+=dy*.006;gem.rotation.y+=dx*.006;vel=dx*.002;lastX=e.clientX;lastY=e.clientY}else{hover=hitAt(e);hoverName.textContent=hover?hover.name+'  ↗':'';hoverName.classList.toggle('show',!!hover);host.style.cursor=hover?'pointer':'grab'}});host.addEventListener('pointerup',e=>{if(!moved){const item=hitAt(e);if(item)location.href=item.url}drag=false});host.addEventListener('pointercancel',()=>drag=false);
function resize(){const w=host.clientWidth,h=host.clientHeight;camera.aspect=w/h;camera.position.z=w<700?15.7:11.5;camera.position.x=w<700?0.05:-.35;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}window.addEventListener('resize',resize);resize();
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let previous=performance.now();function frame(now){const dt=Math.min((now-previous)/1000,.05);previous=now;if(!drag&&!reduced){gem.rotation.x+=.095*dt;gem.rotation.y+=vel*dt;vel*=.97;gem.rotation.x+=.014*dt}renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script><script>window.addEventListener('error',e=>{if(e.message&&e.message.includes('module'))document.getElementById('fallback').style.display='flex'});</script>
